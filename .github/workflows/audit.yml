name: Dependency audit

on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 06:00 UTC — review on Monday morning, fix during the week.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: pnpm audit (high+)
    runs-on: ubuntu-latest
    # Non-blocking: a vuln finding is a notification, not a merge gate.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (high+)
        run: pnpm audit --audit-level=high
