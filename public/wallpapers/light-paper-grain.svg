<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice" width="1920" height="1200">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf9f1"/>
      <stop offset="100%" stop-color="#f5ede0"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0 0.4  0 0 0 0.18 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="vignette">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0%" stop-color="#fdf9f1" stop-opacity="0"/>
      <stop offset="70%" stop-color="#e8dcc6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#cdbfa3" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1200" fill="url(#paper)"/>
  <rect width="1920" height="1200" fill="url(#paper)" filter="url(#grain)"/>
  <rect width="1920" height="1200" fill="url(#vig)"/>
</svg>
