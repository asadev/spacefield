<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spacefield Capture</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        font-family:
          system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #0f172a;
      }
      body {
        width: 320px;
        padding: 16px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 700;
      }
      p.lede {
        margin: 0 0 12px;
        font-size: 12px;
        color: #64748b;
      }
      label {
        display: block;
        font-size: 10px;
        font-weight: 600;
        color: #64748b;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin: 8px 0 4px;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 12px;
        font-family: inherit;
        background: #ffffff;
        color: #0f172a;
      }
      textarea {
        resize: vertical;
        min-height: 60px;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 6px;
        background: #0f172a;
        color: #ffffff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover {
        background: #1e293b;
      }
      .status {
        margin-top: 10px;
        font-size: 11px;
        color: #64748b;
        min-height: 14px;
      }
      .status.ok {
        color: #059669;
      }
      .status.err {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <h1>Spacefield Capture</h1>
    <p class="lede">Save this page to your workspace as a lead.</p>
    <label for="sf-title">Title</label>
    <input id="sf-title" type="text" />
    <label for="sf-url">URL</label>
    <input id="sf-url" type="url" />
    <label for="sf-selection">Selection / Notes</label>
    <textarea id="sf-selection"></textarea>
    <button id="sf-save">Save to Spacefield</button>
    <div class="status" id="sf-status"></div>
    <script src="popup.js"></script>
  </body>
</html>
